resources:
  jobs:
    uber_eats_marketplace_bootstrap:
      name: uber-eats-marketplace-bootstrap-${bundle.target}
      description: One-time Unity Catalog setup for the Uber Eats marketplace lakehouse target.
      max_concurrent_runs: 1
      tasks:
        - task_key: setup_uc_objects
          notebook_task:
            notebook_path: ../notebooks/00_setup/00_create_uc_objects.py
            base_parameters:
              catalog: ${var.catalog}

    uber_eats_marketplace_lakehouse:
      name: uber-eats-marketplace-lakehouse-${bundle.target}
      description: Incremental Uber Eats marketplace lakehouse processing pipeline.
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: ingest_bronze_autoloader
          notebook_task:
            notebook_path: ../notebooks/01_bronze/01_autoloader_ingest.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: build_silver
          depends_on:
            - task_key: ingest_bronze_autoloader
          notebook_task:
            notebook_path: ../notebooks/02_silver/01_build_silver.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: enforce_silver_dq
          depends_on:
            - task_key: build_silver
          notebook_task:
            notebook_path: ../notebooks/03_dq/01_run_data_quality.py
            base_parameters:
              catalog: ${var.catalog}
              dq_scope: silver

        - task_key: build_dimensions_scd2
          depends_on:
            - task_key: enforce_silver_dq
          notebook_task:
            notebook_path: ../notebooks/04_gold/01_build_dimensions_scd2.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: build_gold_facts
          depends_on:
            - task_key: build_dimensions_scd2
          notebook_task:
            notebook_path: ../notebooks/04_gold/02_build_gold_facts.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: publish_genie_assets
          depends_on:
            - task_key: build_gold_facts
          notebook_task:
            notebook_path: ../notebooks/06_genie/01_publish_genie_views.py
            base_parameters:
              catalog: ${var.catalog}

    uber_eats_marketplace_gold_maintenance:
      name: uber-eats-marketplace-gold-maintenance-${bundle.target}
      description: On-demand Delta optimization and table-property maintenance for gold tables.
      max_concurrent_runs: 1
      tasks:
        - task_key: optimize_gold_tables
          notebook_task:
            notebook_path: ../notebooks/05_optimization/01_optimize_gold_tables.py
            base_parameters:
              catalog: ${var.catalog}
