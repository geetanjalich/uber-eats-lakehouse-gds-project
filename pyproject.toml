# the identity card
[project]
name = "uber-eats-marketplace-lakehouse"
version = "0.1.0"
description = "Production-minded Uber Eats marketplace lakehouse reference implementation for Databricks Free Edition."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pyspark>=3.5.0,<3.6.0",
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
